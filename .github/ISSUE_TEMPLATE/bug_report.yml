name: Bug report
description: Something doesn't work as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: db-relay version
      placeholder: 0.1.0
    validations:
      required: true
  - type: dropdown
    id: build
    attributes:
      label: Which build?
      options:
        - Embedded (db-relay.exe)
        - External (db-relay-external.exe)
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
  - type: dropdown
    id: setup
    attributes:
      label: Server setup used
      options:
        - Option A (CLI)
        - Option B (Dashboard)
        - Option C (Dashboard quick path)
        - Not sure
  - type: textarea
    id: log
    attributes:
      label: Log lines
      description: The lines from the log panel around the problem. Remove your hostname if you don't want it public.
      render: text
